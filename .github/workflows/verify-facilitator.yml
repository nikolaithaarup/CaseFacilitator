name: Verify SynapseFacilitator

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_USE_FIREBASE_EMULATORS: "true"
      EXPO_PUBLIC_FIREBASE_EMULATOR_PROJECT_ID: demo-synapse-facilitator
      EXPO_PUBLIC_FACILITATOR_ALLOW_STANDALONE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test tests/bridge.grant.test.mjs
      - run: npm run build:web
